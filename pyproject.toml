[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-stats-simulator"
version = "0.1.0"
description = "NBA per-minute production simulator: projects minutes and PPM/RPM/APM for upcoming games and surfaces minutes-uplift outliers."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "nba_api>=1.4",
    "lightgbm>=4.1",
    "scikit-learn>=1.3",
    "typer>=0.9",
    "rich>=13.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
simulator = "simulator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
